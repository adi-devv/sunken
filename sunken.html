function updatePlayer(dt){
 const sp0=journal.open||S.paused?0:1;
 let fw=0,rt=0,up=0;
 if(sp0){if(keys.KeyW)fw+=1;if(keys.KeyS)fw-=1;if(keys.KeyD)rt+=1;if(keys.KeyA)rt-=1;if(keys.Space||keys.KeyE)up+=1;if(keys.KeyQ||keys.KeyC||keys.ControlLeft||keys.ControlRight)up-=1;

 if(sp0&&!locked&&!dragging&&mouse.inside&&S.mode==='play'){const ez=(v,dz)=>{const a=Math.abs(v);if(a<dz)return 0;const t=Math.min(1,(a-dz)/(0.92-dz));return Math.sign(v)*t*t};
  const dzx=lockBroken?0.1:0.3,dzy=lockBroken?0.22:0.4;P.yaw+=ez(mouse.nx,dzx)*dt*2.6;P.pitch=clamp(P.pitch-ez(mouse.ny,dzy)*dt*1.4,-1.5,1.5)}
 const boost=sp0&&(keys.ShiftLeft||keys.ShiftRight);const cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),sy=Math.sin(P.yaw),cy_=Math.cos(P.yaw);
 const fx_=cp*sy,fy_=sp,fz_=cp*cy_,rx_=cy_,rz_=-sy;
 let wx=fx_*fw+rx_*rt,wy=fy_*fw+up,wz=fz_*fw+rz_*rt;const wl=Math.hypot(wx,wy,wz);const spd=(boost?7.5:3.6)*(1+0.22*finsLv);
 if(wl>0){wx=wx/wl*spd;wy=wy/wl*spd;wz=wz/wl*spd}

 P.vx+=curX*0.02*dt;

 // bounds

 const gh=H(P.x,P.z)+1.3;if(P.y<gh){P.y=gh;if(P.vy<0)P.vy*=0.2}

const _p=[0,0,0],_c=[0,0,0];const AXI=[[0,1,2],[1,0,2],[2,0,1]];
function collide(){const R=0.85;
 for(let n=0;n<PR.length;n++){const p=PR[n];if(p.y>1e3)continue;const dx=P.x-p.x,dy=P.y-p.y,dz=P.z-p.z;const lim=p.br+R+0.1;if(Math.abs(dx)>lim||Math.abs(dy)>lim||Math.abs(dz)>lim)continue;
  if(p.k===0){const qx=clamp(P.x,p.x-p.a,p.x+p.a),qy=clamp(P.y,p.y-p.b,p.y+p.b),qz=clamp(P.z,p.z-p.c,p.z+p.c);let ex=P.x-qx,ey=P.y-qy,ez=P.z-qz;const d2=ex*ex+ey*ey+ez*ez;
   if(d2>=R*R)continue;if(d2>1e-8){const d=Math.sqrt(d2),f=(R-d)/d;P.x+=ex*f;P.y+=ey*f;P.z+=ez*f}
   else{const px=p.a-Math.abs(dx),py=p.b-Math.abs(dy),pz=p.c-Math.abs(dz);if(px<=py&&px<=pz)P.x+=(dx>0?1:-1)*(px+R);else if(py<=pz)P.y+=(dy>0?1:-1)*(py+R);else P.z+=(dz>0?1:-1)*(pz+R)}}
  else if(p.k===1){const ax=AXI[p.ax];_p[0]=P.x;_p[1]=P.y;_p[2]=P.z;_c[0]=p.x;_c[1]=p.y;_c[2]=p.z;const a=_p[ax[0]]-_c[ax[0]],u=_p[ax[1]]-_c[ax[1]],v=_p[ax[2]]-_c[ax[2]];
   const rd=Math.hypot(u,v);const ca=clamp(a,-p.hl,p.hl);const rr=Math.min(rd,p.r);const cu=rd>1e-6?u/rd*rr:0,cv2=rd>1e-6?v/rd*rr:0;let ea=a-ca,eu=u-cu,ev=v-cv2;const d2=ea*ea+eu*eu+ev*ev;
   if(d2>=R*R)continue;
   if(d2>1e-8){const d=Math.sqrt(d2),f=(R-d)/d;ea*=f;eu*=f;ev*=f}else{const pr=p.r-rd,pa=p.hl-Math.abs(a);if(pr<pa){const l=rd>1e-6?1/rd:0;eu=(rd>1e-6?u*l:1)*(pr+R);ev=(rd>1e-6?v*l:0)*(pr+R);ea=0}else{ea=(a>0?1:-1)*(pa+R);eu=0;ev=0}}
   _p[ax[0]]+=ea;_p[ax[1]]+=eu;_p[ax[2]]+=ev;P.x=_p[0];P.y=_p[1];P.z=_p[2]}
  else{const rr=Math.max(p.a,p.b,p.c)+R;const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-6;if(d<rr){const f=(rr-d)/d;P.x+=dx*f;P.y+=dy*f;P.z+=dz*f}}}}
function updateEnv(){
 envDep=clamp(-cy,0,198);const l=li(envDep);fogR=FOGR[l];fogG=FOGG[l];fogB=FOGB[l];sunS=SUNG[l];dens=0.042+envDep*0.0005;maxD=clamp(3/dens,24,58);lampI=(smooth(8,70,envDep)*0.9+0.22)*(1+0.3*lampLv);causticK=1}

function glowPass(){
 for(let k=0;k<NC;k++){const m=Math.max(fR[k],fG[k],fB[k]);const e=m-0.62;if(e>0){const s=e*1.1;glR[k]=fR[k]*s;glG[k]=fG[k]*s;glB[k]=fB[k]*s}else{glR[k]=glG[k]=glB[k]=0}}
 // horizontal blur radius 2
 for(let j=0;j<ROWS;j++){const o=j*COLS;for(let i=0;i<COLS;i++){let r=0,g=0,b=0,w=0;for(let d=-2;d<=2;d++){const x=i+d;if(x<0||x>=COLS)continue;const k=o+x,ww=3-Math.abs(d)*0.9;r+=glR[k]*ww;g+=glG[k]*ww;b+=glB[k]*ww;w+=ww}tmpR[o+i]=r/w;tmpG[o+i]=g/w;tmpB[o+i]=b/w}}
 for(let j=0;j<ROWS;j++){for(let i=0;i<COLS;i++){let r=0,g=0,b=0,w=0;for(let d=-1;d<=1;d++){const y=j+d;if(y<0||y>=ROWS)continue;const k=y*COLS+i,ww=d?1:2;r+=tmpR[k]*ww;g+=tmpG[k]*ww;b+=tmpB[k]*ww;w+=ww}
   const k=j*COLS+i;const gr=r/w*2.2,gg=g/w*2.2,gb=b/w*2.2;bR[k]+=gr*0.12;bG[k]+=gg*0.12;bB[k]+=gb*0.12;fR[k]+=gr*0.3;fG[k]+=gg*0.3;fB[k]+=gb*0.3}}}
const b8=x=>x<=0?0:x>=1?255:(x*255)|0;
function draw(){
 const W=cv.width;const px=pix32;const fadeIn=dive<1?dive:1;
 for(let j=0;j<ROWS;j++){const rowBase=j*CH*W;for(let i=0;i<COLS;i++){const k=j*COLS+i;const base=rowBase+i*CW;
  const f=fadeIn;const bgp=(0xff000000|(b8(bB[k]*f)<<16)|(b8(bG[k]*f)<<8)|b8(bR[k]*f))>>>0;
  for(let y=0;y<CH;y++){const o=base+y*W;for(let x=0;x<CW;x++)px[o+x]=bgp}
  const g=gl[k];if(g===0)continue;const s0=atlasStart[g],s1=atlasStart[g+1];if(s0===s1)continue;
  const fr=b8(fR[k]*f),fg=b8(fG[k]*f),fb=b8(fB[k]*f);const fgp=(0xff000000|(fb<<16)|(fg<<8)|fr)>>>0;
  const bRB=bgp&0x00ff00ff,bGG=bgp&0x0000ff00,fRB=fgp&0x00ff00ff,fGG=fgp&0x0000ff00;
  for(let n=s0;n<s1;n++){const a=atlasA[n],o=base+atlasOff[n];if(a>=250){px[o]=fgp;continue}const ia=256-a;
   const rb=((bRB*ia+fRB*a)>>>8)&0x00ff00ff;const gg=((bGG*ia+fGG*a)>>>8)&0x0000ff00;px[o]=(0xff000000|rb|gg)>>>0}}}
 // UI layer: darken backing, then draw crisp text on top
 for(let j=0;j<UROWS;j++)for(let i=0;i<UCOLS;i++){const k=j*UCOLS+i;const kk=uK[k],g=ugl[k];if(kk>=0.999&&g===0)continue;const base=(UOY+j*UCH)*W+UOX+i*UCW;
  if(kk<0.999){const m=Math.max(0,(kk*256)|0);for(let y=0;y<UCH;y++){const o=base+y*W;for(let x=0;x<UCW;x++){const p=px[o+x];px[o+x]=(0xff000000|((((p&0xff00ff)*m)>>>8)&0xff00ff)|((((p&0xff00)*m)>>>8)&0xff00))>>>0}}}
  if(g===0)continue;const s0=uAS[g],s1=uAS[g+1];if(s0===s1)continue;
  const r=uR[k],gg=uG[k],bb=uB[k];const op=Math.min(1,Math.max(r,gg,bb)*3);if(op<0.02)continue;
  const fRB=(b8(bb)<<16)|b8(r),fGG=b8(gg)<<8;
  for(let n=s0;n<s1;n++){const a=(uAA[n]*op)|0,o=base+uAO[n];const p=px[o];const ia=256-a;
   px[o]=(0xff000000|((((p&0xff00ff)*ia+fRB*a)>>>8)&0xff00ff)|((((p&0xff00)*ia+fGG*a)>>>8)&0xff00))>>>0}}
 ctx.putImageData(imgData,0,0)}

let last=-1,slowCount=0,fpsAcc=0,fpsN=0,lastReal=performance.now();
const attract=t=>{P.x=xc(70+55*Math.sin(t*0.035))+18*Math.sin(t*0.07);P.z=70+55*Math.sin(t*0.035);P.y=-5.5+1.2*Math.sin(t*0.11);P.yaw=0.5*Math.sin(t*0.07)+0.2;P.pitch=-0.06+0.07*Math.sin(t*0.13)}
function step(ms){

 const realDt=(t0-lastReal)/1000;lastReal=t0;if(realDt>0&&realDt<1){perf.frameMs=perf.frameMs*0.92+realDt*1000*0.08;perf.fps=1000/perf.frameMs}

 let speed=0;
 if(S.mode==='title'){attract(T)}else if(!S.paused){if(dive<1)dive=Math.min(1,dive+dt*0.8);speed=updatePlayer(dt);relicCheck()}
 // camera
 {const sw=S.mode==='play'?1:0;cx=P.x+sw*(0.22*Math.sin(T*0.37)+0.08*Math.sin(T*0.91))*Math.cos(P.yaw);cy=P.y+Math.sin(T*0.7)*0.04+sw*0.14*Math.sin(T*0.53);cz=P.z-sw*(0.22*Math.sin(T*0.37)+0.08*Math.sin(T*0.91))*Math.sin(P.yaw)}

 if(S.mode==='title'||dive>=0){}

 const wobA=FOCAL*0.006,wobT=T*1.5;for(let k=0;k<NC;k++){const il=invLen[k],py=cellPY[k],px=cellPX[k]+Math.sin(py*0.035+wobT)*wobA;dirX[k]=(fX*FOCAL+rX*px+uX*py)*il;dirY[k]=(fY*FOCAL+uY*py)*il;dirZ[k]=(fZ*FOCAL+rZ*px+uZ*py)*il}
 beamUpdate();gatherLights();
 const t1=performance.now();
 primPass();worldPass();
 const t2=performance.now();
 floraPass();edgePass();fishPass();animalPass();critterPass();jellyPass();particlePass(paused?0:dt);
 const t3=performance.now();
 ugl.fill(0);uK.fill(1);
 if(S.mode==='title')titlePass();else hudPass();
 // fps
 if(S.mode!=='title'||true){const s=perf.fps.toFixed(0)+' fps';puts(UCOLS-s.length-1,UROWS-1,s,0.3,0.45,0.5,-1)}
 glowPass();
 const t4=performance.now();

 audioFrame(dt,speed);
 if(S.mode==='play'&&!paused&&AC&&!S.muted){whaleT-=dt;if(whaleT<0){whaleT=40+Math.random()*50;whaleCall(0.35)}}
 // auto glyph size

}

setupGrid();
if(document.fonts&&document.fonts.load){const to=new Promise(r=>setTimeout(r,2500));Promise.race([document.fonts.load('14px "JetBrains Mono"'),to]).then(()=>{fontOK=true;buildAtlas()}).catch(()=>{})}

window.__sunken={step,S,P,perf,RL,PR,ping,journal,keys,get found(){return found},get T(){return T},H,setFs(v){fs=v;setupGrid()},get ui(){return[UCOLS,UROWS,UCW,UCH,ufs,uiZoom]},get dims(){return[COLS,ROWS,CW,CH]},tele(x,y,z,yaw,pitch){P.x=x;P.y=y;P.z=z;P.yaw=yaw||0;P.pitch=pitch||0;P.vx=P.vy=P.vz=0},start(){S.mode='play';S.paused=false;S.startT=T;dive=1},doPing(){ping.t=T},whistle(){ping.t=-99;doPing()},AN,POD,whale,discover,get panel(){return panel}};
